name: Build and Deploy

# On a v* tag: build the site, bake it into an image, push it to the Forgejo
# container registry, then record the resulting digest in deploy-gtfs-rt.
# ArgoCD watches that repo and rolls the new image out; nothing here talks to
# the cluster directly.
#
# Requires:
#   Variables (Settings → Variables → Actions):
#     REGISTRY_DOMAIN  - hostname of the container registry, e.g. git.kcfam.us
#     DEPLOY_USER      - username to authenticate with the registry, e.g. maxtkc
#   Secrets (Settings → Secrets → Actions):
#     DEPLOY_TOKEN     - access token with write:package and write:repository
#                        scope; write:repository is what lets the digest commit
#                        land in deploy-gtfs-rt

on:
  push:
    tags:
      - 'v*'

env:
  SITE_DIR: sites

jobs:
  build:
    runs-on: alpine-3.23

    steps:
      # docker-cli talks to the host daemon over the socket the runner mounts
      # into every job container; kustomize is needed for the deploy-repo bump.
      - name: Install dependencies
        run: |
          apk add --no-cache nodejs npm git docker-cli docker-cli-buildx kustomize
          npm install -g pnpm@11.20.0

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          github-server-url: https://${{ vars.REGISTRY_DOMAIN }}

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Precompressed siblings for nginx's gzip_static. Brotli would be better
      # still, but the official nginx image ships no brotli module.
      - name: Precompress assets
        run: |
          find dist -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.svg' \) \
            -size +1k -exec gzip -9 -k -f {} +

      - name: Login to registry
        run: |
          echo "${{ secrets.DEPLOY_TOKEN }}" | \
            docker login ${{ vars.REGISTRY_DOMAIN }} -u ${{ vars.DEPLOY_USER }} --password-stdin

      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE=${{ vars.REGISTRY_DOMAIN }}/${{ github.repository }}
          docker build -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
          # Deploy by digest, not by tag: the tag is a moving reference, the
          # digest is exactly what was built here.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}" | cut -d@ -f2)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Record digest in deploy-gtfs-rt
        run: |
          git clone --depth 1 \
            "https://${{ vars.DEPLOY_USER }}:${{ secrets.DEPLOY_TOKEN }}@${{ vars.REGISTRY_DOMAIN }}/gtfs.zone/deploy-gtfs-rt.git" \
            /tmp/deploy
          cd "/tmp/deploy/${SITE_DIR}"
          kustomize edit set image "${IMAGE}=${IMAGE}@${DIGEST}"
          cd /tmp/deploy
          git config user.name "forgejo-actions"
          git config user.email "actions@${{ vars.REGISTRY_DOMAIN }}"
          git add "${SITE_DIR}/kustomization.yaml"
          git commit -m "deploy(viz.rt.gtfs.zone): test-track ${{ github.ref_name }}"
          # Concurrent site releases race on the same file; rebase and retry
          # rather than failing the release.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
