
name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: alpine-3.23

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache nodejs npm git curl tar

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          github-server-url: https://git.kcfam.us

      - name: Build
        run: npm ci && npm run build

      - name: Deploy
        run: |
          echo "Copying build to /sites/viz.rt.gtfs.zone"
          mkdir -p /sites/viz.rt.gtfs.zone
          rm -rf /sites/viz.rt.gtfs.zone/*
          cp -vr dist/. /sites/viz.rt.gtfs.zone/

