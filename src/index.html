<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>viz.rt.gtfs.zone - GTFS Realtime Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>

  <body class="font-sans h-screen overflow-hidden">
    <div class="h-screen grid grid-rows-[auto_1fr]">

      <!-- Navbar -->
      <div class="navbar bg-base-100 border-b border-base-300 z-50">
        <div class="navbar-start">
          <a href="https://gtfs.zone" class="flex items-center gap-3" target="_blank" rel="noopener noreferrer">
            <div class="avatar">
              <div class="w-8 rounded-lg">
                <img src="logo.svg" alt="viz.rt.gtfs.zone logo" />
              </div>
            </div>
            <h1 class="text-xl font-bold hidden md:block">
              <span class="text-primary">viz</span>.rt.gtfs.zone<sup
                id="app-version"
                class="text-xs opacity-50 font-normal ml-1"
              ></sup>
            </h1>
          </a>
        </div>

        <div class="navbar-end">
          <div class="flex items-center gap-2">

            <!-- Alerts Button -->
            <div class="indicator">
              <span id="alerts-badge" class="indicator-item badge badge-error badge-xs hidden"></span>
              <button
                id="alerts-btn"
                class="btn btn-ghost btn-sm btn-square"
                title="Service Alerts"
                onclick="document.getElementById('alerts-modal').showModal()"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
              </button>
            </div>

            <!-- About Button -->
            <button
              id="about-btn"
              class="btn btn-ghost btn-sm btn-square"
              title="About"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>

            <!-- Theme Toggle -->
            <label class="swap swap-rotate">
              <input type="checkbox" class="theme-controller" value="light" />
              <svg class="swap-on h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
              </svg>
              <svg class="swap-off h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
              </svg>
            </label>

          </div>
        </div>
      </div>

      <!-- Map Area -->
      <div class="relative bg-base-300">
        <!-- MapLibre map -->
        <div id="map" class="w-full h-full"></div>

        <!-- Feed Config Card (top-left overlay) -->
        <div class="absolute top-3 left-3 z-40 w-72">
          <details id="feed-config" class="card card-bordered bg-base-100 shadow-xl" open>
            <summary class="cursor-pointer px-4 py-3 flex items-center justify-between select-none">
              <span class="font-semibold text-sm">Feed Configuration</span>
              <svg class="h-4 w-4 opacity-60 transition-transform details-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </summary>

            <div class="px-4 pb-4 space-y-3">

              <!-- Status line -->
              <p id="feed-status" class="text-xs opacity-60">No feed loaded</p>

              <!-- Load dropdown -->
              <div class="dropdown w-full">
                <label tabindex="0" class="btn btn-primary btn-sm w-full">
                  Load
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                  </svg>
                </label>
                <ul tabindex="0" class="dropdown-content menu bg-base-200 rounded-box z-50 w-full p-1 shadow-lg mt-1">
                  <li><a id="load-examples-btn">Examples</a></li>
                  <li><a id="load-atlas-btn">From TransitLand Atlas</a></li>
                  <li><a id="load-manual-btn">Manual…</a></li>
                </ul>
              </div>

              <!-- Refresh RT button — hidden until a feed is loaded -->
              <button id="refresh-rt-btn" class="btn btn-outline btn-sm w-full hidden">
                Refresh RT
              </button>

            </div>
          </details>
        </div>

        <!-- Stop Info Bottom Sheet -->
        <div
          id="stop-sheet"
          class="absolute bottom-0 left-0 right-0 z-40 transition-transform duration-300 translate-y-full"
        >
          <div class="card card-bordered bg-base-100 shadow-xl rounded-b-none max-h-64 flex flex-col">
            <!-- Handle + header -->
            <div class="flex items-center justify-between px-4 pt-3 pb-2 border-b border-base-300 flex-shrink-0">
              <div>
                <p class="text-xs opacity-50 uppercase tracking-wide">Stop</p>
                <h2 id="stop-sheet-name" class="font-semibold text-sm"></h2>
                <p id="stop-sheet-id" class="text-xs opacity-50"></p>
              </div>
              <button
                class="btn btn-ghost btn-sm btn-square"
                onclick="document.getElementById('stop-sheet').classList.add('translate-y-full')"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Content -->
            <div class="overflow-y-auto flex-1 p-4 space-y-3">
              <!-- Trip Updates -->
              <div>
                <h3 class="text-xs font-semibold uppercase tracking-wide opacity-60 mb-2">Upcoming Trips</h3>
                <div id="stop-sheet-trips" class="space-y-1">
                  <p class="text-xs opacity-40">No trip data loaded.</p>
                </div>
              </div>

              <!-- Stop Alerts -->
              <div id="stop-sheet-alerts-section" class="hidden">
                <h3 class="text-xs font-semibold uppercase tracking-wide opacity-60 mb-2">Alerts</h3>
                <div id="stop-sheet-alerts" class="space-y-1"></div>
              </div>
            </div>
          </div>
        </div>

      </div><!-- end map area -->
    </div><!-- end grid -->

    <!-- Alerts Modal -->
    <dialog id="alerts-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl max-h-[80vh] flex flex-col p-0">
        <div class="flex items-center justify-between px-4 py-3 border-b border-base-300 flex-shrink-0">
          <h3 class="text-base font-semibold">Service Alerts</h3>
          <button
            class="btn btn-ghost btn-sm btn-square"
            onclick="document.getElementById('alerts-modal').close()"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="overflow-y-auto flex-1 p-4">
          <div id="alerts-list" class="space-y-3">
            <p class="text-sm opacity-40 text-center py-8">No service alerts.</p>
          </div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
