<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>viz.rt.gtfs.zone - GTFS Realtime Visualizer</title>
    <meta name="description" content="Browser-based GTFS Realtime visualizer. Watch live vehicle positions, trip updates and service alerts from any GTFS Realtime feed on a map. Everything is decoded in your browser." />
    <link rel="canonical" href="https://viz.rt.gtfs.zone/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gtfs.zone" />
    <meta property="og:url" content="https://viz.rt.gtfs.zone/" />
    <meta property="og:title" content="viz.rt.gtfs.zone - GTFS Realtime Visualizer" />
    <meta property="og:description" content="Browser-based GTFS Realtime visualizer. Watch live vehicle positions, trip updates and service alerts from any GTFS Realtime feed on a map. Everything is decoded in your browser." />
    <meta property="og:image" content="https://viz.rt.gtfs.zone/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>

  <body class="font-sans h-screen overflow-hidden">
    <div class="app-container h-screen grid grid-rows-[auto_1fr]">

      <!-- Navbar -->
      <div class="navbar bg-base-100 col-span-2 border-b border-base-300 z-50">
        <div class="navbar-start">
          <a href="https://gtfs.zone" class="flex items-center gap-4" target="_blank" rel="noopener noreferrer">
            <div class="avatar">
              <div class="w-8 rounded-lg">
                <img src="logo.svg" alt="viz.rt.gtfs.zone logo" />
              </div>
            </div>
            <h1 class="text-xl font-bold hidden md:block">
              <span class="text-primary">viz</span>.rt.gtfs.zone<sup
                id="app-version"
                class="text-xs opacity-50 font-normal ml-1"
              ></sup>
            </h1>
          </a>
        </div>

        <div class="navbar-end">
          <div class="flex items-center gap-2">

            <!-- Reload Feed -->
            <button
              id="reload-feed-btn"
              class="btn btn-ghost btn-sm btn-square hidden"
              title="Reload feed"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356m-.001 4.992-3.181-3.183a8.25 8.25 0 0 0-13.803 3.7M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7" />
              </svg>
            </button>

            <!-- Open in Editor (coloring-book) -->
            <a
              id="edit-feed-btn"
              class="btn btn-ghost btn-sm btn-square hidden"
              title="Edit schedule in coloring-book"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125" />
              </svg>
            </a>

            <!-- Alerts Button -->
            <div class="indicator">
              <span id="alerts-badge" class="indicator-item badge badge-error badge-xs hidden"></span>
              <button
                id="alerts-btn"
                class="btn btn-ghost btn-sm btn-square"
                title="Service Alerts"
                onclick="document.getElementById('alerts-modal').showModal()"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
              </button>
            </div>

            <!-- Realtime Refresh Rate -->
            <div id="rt-interval-dropdown" class="dropdown dropdown-end hidden">
              <label tabindex="0" class="btn btn-ghost btn-sm" title="Realtime refresh rate">
                <span id="rt-interval-label">15s</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </label>
              <ul id="rt-interval-menu" tabindex="0" class="dropdown-content menu bg-base-200 rounded-box z-50 w-28 p-1 shadow-lg mt-1"></ul>
            </div>

            <!-- Theme Toggle -->
            <label class="swap swap-rotate">
              <input type="checkbox" class="theme-controller" value="light" />
              <svg class="swap-on h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
              </svg>
              <svg class="swap-off h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
              </svg>
            </label>

            <!-- Help Button -->
            <button
              id="help-btn"
              class="btn btn-ghost btn-sm btn-square"
              title="Help"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>

            <!-- Load — opens the one modal; there is nothing to choose first -->
            <button id="load-btn" class="btn btn-primary btn-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
              </svg>
              <span class="hidden md:inline">Load</span>
            </button>

          </div>
        </div>
      </div>

      <!-- Map Area -->
      <div class="relative bg-base-300 min-h-0">
        <!-- MapLibre map -->
        <div id="map" class="w-full h-full"></div>

        <!-- Map Controls -->
        <div
          id="map-controls"
          class="absolute top-2 left-2 right-2 z-40 flex flex-row items-start gap-2 pointer-events-none"
        >
          <!-- Search -->
          <div
            id="map-search-card"
            class="relative flex-1 max-w-sm card card-bordered bg-base-100 shadow-lg p-2 pointer-events-auto"
          >
            <input
              type="text"
              id="map-search"
              placeholder="Search"
              class="input input-sm w-full"
            />
          </div>
        </div>
      </div><!-- end map area -->

      <!-- Right Panel -->
      <div
        id="right-panel"
        class="right-panel relative bg-base-200 border-l border-base-300 flex flex-col overflow-hidden min-h-0"
      >
        <div
          id="sheet-top-handle"
          class="md:hidden flex justify-center items-center py-2 cursor-grab active:cursor-grabbing flex-shrink-0"
        >
          <div class="w-10 h-1 rounded-full bg-base-content/20"></div>
        </div>
        <div
          id="panel-resizer"
          class="hidden md:block absolute left-0 top-0 bottom-0 w-2 cursor-col-resize z-10 group"
        >
          <div
            class="absolute inset-y-0 left-0.5 w-px bg-base-300 group-hover:bg-primary/50 transition-colors"
          ></div>
        </div>

        <!-- Panel content host — filled by focus type in a later plan -->
        <div id="panel-content" class="panel-scroll flex-1 overflow-y-auto bg-base-100 p-4">
          <p class="text-base-content/50 text-sm text-center py-8">No feed loaded</p>
        </div>
      </div>
    </div><!-- end grid -->

    <!-- Alerts Modal -->
    <dialog id="alerts-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl max-h-[80vh] flex flex-col p-0">
        <div class="flex items-center justify-between px-4 py-3 border-b border-base-300 flex-shrink-0">
          <h3 class="text-base font-semibold">Service Alerts</h3>
          <button
            class="btn btn-ghost btn-sm btn-square"
            onclick="document.getElementById('alerts-modal').close()"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="overflow-y-auto flex-1 p-4">
          <div id="alerts-list" class="space-y-3">
            <p class="text-sm opacity-40 text-center py-8">No service alerts.</p>
          </div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
